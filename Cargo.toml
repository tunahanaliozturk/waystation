[package]
name = "waystation"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "An HTTP reverse proxy and load balancer with hot reload, built on tokio, hyper and rustls"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tunahanaliozturk/waystation"
readme = "README.md"
keywords = ["proxy", "reverse-proxy", "load-balancer", "http", "http2"]
categories = ["network-programming", "web-programming::http-server"]
exclude = ["/.github", "/docs"]

[dependencies]
http = "1.5.0"
hyper = { version = "1.13.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "macros", "io-util", "sync", "signal"] }

[dev-dependencies]
cap = { version = "0.1.2", features = ["stats"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
expect_used = "warn"
panic = "warn"
print_stdout = "warn"
print_stderr = "warn"
clone_on_ref_ptr = "warn"
unimplemented = "warn"
cast_possible_truncation = "warn"
cast_lossless = "warn"
dbg_macro = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
todo = "warn"
unwrap_used = "warn"
